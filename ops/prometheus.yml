global:
  scrape_interval: 10s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: backend
    static_configs:
      - targets: [backend:8000]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: grafana
    static_configs:
      - targets: [grafana:3000]
  - job_name: serving
    static_configs:
      - targets: [serving:8002]
  - job_name: frontend
    static_configs:
      - targets: [frontend-exporter:9113]
